<text x="600" y="2314.4" font-size="42" fill="#55524e">The habits, history and language an</text>
<text x="600" y="2368.4" font-size="42" fill="#55524e">organisation grows from. The slowest</text>
<text x="600" y="2422.4" font-size="42" fill="#55524e">ground of all</text>
<line x1="536.8" y1="2495.4" x2="580.0" y2="2495.4" stroke="#d63c23" stroke-width="1.19" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="528.8" cy="2495.4" r="7.14" fill="#ffffff" stroke="#d63c23" stroke-width="1.7"/>
