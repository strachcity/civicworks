<text x="600" y="2051.752" font-size="42" fill="#55524e">The systems, tools, documents and</text>
<text x="600" y="2105.752" font-size="42" fill="#55524e">offices that the everyday work flows</text>
<text x="600" y="2159.752" font-size="42" fill="#55524e">through</text>
<line x1="536.8" y1="2232.8" x2="580.0" y2="2232.8" stroke="#d63c23" stroke-width="1.19" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="528.8" cy="2232.8" r="7.14" fill="#ffffff" stroke="#d63c23" stroke-width="1.7"/>
<text x="600" y="2247.752" font-size="46" font-weight="600" letter-spacing="1.4" fill="#a92c17">CULTURE</text>
<text x="600" y="2301.752" font-size="42" fill="#55524e">The habits, history and language an</text>
<text x="600" y="2355.752" font-size="42" fill="#55524e">organisation grows from. The slowest</text>
<text x="600" y="2409.752" font-size="42" fill="#55524e">ground of all</text>
<line x1="536.8" y1="2482.8" x2="580.0" y2="2482.8" stroke="#d63c23" stroke-width="1.19" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="528.8" cy="2482.8" r="7.14" fill="#ffffff" stroke="#d63c23" stroke-width="1.7"/>
<text x="600" y="2497.752" font-size="46" font-weight="600" letter-spacing="1.4" fill="#a92c17">THE PLACE OF WORK</text>
<text x="600" y="2551.752" font-size="42" fill="#55524e">Where each of these comes together and</text>
<text x="600" y="2605.752" font-size="42" fill="#55524e">becomes lived experience for the</text>
<text x="600" y="2659.752" font-size="42" fill="#55524e">people doing the work</text>
