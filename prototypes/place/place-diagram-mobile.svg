<text x="600" y="1814.4" font-size="42" fill="#55524e">The rules, decision rights and</text>
<text x="600" y="1868.4" font-size="42" fill="#55524e">assurance that decide what can change,</text>
<text x="600" y="1922.4" font-size="42" fill="#55524e">and who gets to say so</text>
