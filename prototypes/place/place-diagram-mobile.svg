<text x="600" y="1801.752" font-size="42" fill="#55524e">The rules, decision rights and</text>
<text x="600" y="1855.752" font-size="42" fill="#55524e">assurance that decide what can change,</text>
<text x="600" y="1909.752" font-size="42" fill="#55524e">and who gets to say so</text>
