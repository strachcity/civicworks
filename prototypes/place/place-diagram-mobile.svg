<text x="600" y="1551.752" font-size="42" fill="#55524e">The relationships, networks and</text>
<text x="600" y="1605.752" font-size="42" fill="#55524e">communities of practice that people</text>
<text x="600" y="1659.752" font-size="42" fill="#55524e">lean on to get things done together</text>
