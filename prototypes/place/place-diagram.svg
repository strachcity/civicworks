<text x="1040" y="742" font-size="21" font-weight="600" letter-spacing=".8" fill="#a92c17">CULTURE</text>
<text x="1040" y="773" font-size="21" fill="#55524e">The habits, history and language an</text>
<text x="1040" y="801" font-size="21" fill="#55524e">organisation grows from. The</text>
<text x="1040" y="829" font-size="21" fill="#55524e">slowest ground of all</text>
<line x1="1010.0" y1="910.0" x2="1026.0" y2="910.0" stroke="#d63c23" stroke-width="0.7" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="1005.0" cy="910.0" r="4.2" fill="#ffffff" stroke="#d63c23" stroke-width="1"/>
<text x="1040" y="917" font-size="21" font-weight="600" letter-spacing=".8" fill="#a92c17">THE PLACE OF WORK</text>
<text x="1040" y="948" font-size="21" fill="#55524e">Where each of these comes together</text>
<text x="1040" y="976" font-size="21" fill="#55524e">and becomes lived experience for</text>
<text x="1040" y="1004" font-size="21" fill="#55524e">the people doing the work</text>
