<text x="1040" y="217" font-size="21" font-weight="600" letter-spacing=".8" fill="#1d1d1b">SOCIAL INFRASTRUCTURE</text>
<text x="1040" y="248" font-size="21" fill="#55524e">The relationships, networks and</text>
<text x="1040" y="276" font-size="21" fill="#55524e">communities of practice that people</text>
<text x="1040" y="304" font-size="21" fill="#55524e">lean on to get things done together</text>
