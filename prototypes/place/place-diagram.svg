<text x="1028" y="217" font-size="21" font-weight="600" letter-spacing=".8" fill="#1d1d1b">SOCIAL INFRASTRUCTURE</text>
<text x="1028" y="248" font-size="21" fill="#55524e">The relationships, networks and</text>
<text x="1028" y="276" font-size="21" fill="#55524e">communities of practice that people</text>
<text x="1028" y="304" font-size="21" fill="#55524e">lean on to get things done together</text>
<line x1="938.0" y1="385.0" x2="1014.0" y2="385.0" stroke="#1d1d1b" stroke-width="0.7" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="933.0" cy="385.0" r="4.2" fill="#ffffff" stroke="#1d1d1b" stroke-width="1"/>
