<text x="1040" y="423" font-size="21" fill="#55524e">The rules, decision rights and</text>
<text x="1040" y="451" font-size="21" fill="#55524e">assurance that decide what can</text>
<text x="1040" y="479" font-size="21" fill="#55524e">change, and who gets to say so</text>
