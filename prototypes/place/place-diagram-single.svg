<line x1="624.0" y1="225.7" x2="983.2" y2="225.7" stroke="#1d1d1b" stroke-width="0.9799999999999999" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="989.2" cy="225.7" r="5.88" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
<text x="64" y="237.7" font-size="36" font-weight="600" letter-spacing="1.2" fill="#1d1d1b">SOCIAL INFRASTRUCTURE</text>
<text x="64" y="282.7" font-size="31" fill="#55524e">The relationships, networks and</text>
<text x="64" y="323.7" font-size="31" fill="#55524e">communities of practice that people</text>
<text x="64" y="364.7" font-size="31" fill="#55524e">lean on to get things done together</text>
<line x1="624.0" y1="450.7" x2="904.0" y2="450.7" stroke="#1d1d1b" stroke-width="0.9799999999999999" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="910.0" cy="450.7" r="5.88" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
<text x="64" y="462.7" font-size="36" font-weight="600" letter-spacing="1.2" fill="#1d1d1b">GOVERNANCE</text>
<text x="64" y="507.7" font-size="31" fill="#55524e">The rules, decision rights and</text>
<text x="64" y="548.7" font-size="31" fill="#55524e">assurance that decide what can</text>
<text x="64" y="589.7" font-size="31" fill="#55524e">change, and who gets to say so</text>
<line x1="624.0" y1="675.7" x2="829.2" y2="675.7" stroke="#1d1d1b" stroke-width="0.9799999999999999" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="835.2" cy="675.7" r="5.88" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
<text x="64" y="687.7" font-size="36" font-weight="600" letter-spacing="1.2" fill="#1d1d1b">PHYSICAL INFRASTRUCTURE</text>
<text x="64" y="732.7" font-size="31" fill="#55524e">The systems, tools, documents and</text>
<text x="64" y="773.7" font-size="31" fill="#55524e">offices that the everyday work flows</text>
<text x="64" y="814.7" font-size="31" fill="#55524e">through</text>
<line x1="624.0" y1="900.7" x2="763.2" y2="900.7" stroke="#1d1d1b" stroke-width="0.9799999999999999" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="769.2" cy="900.7" r="5.88" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
<text x="64" y="912.7" font-size="36" font-weight="600" letter-spacing="1.2" fill="#1d1d1b">CULTURE</text>
<text x="64" y="957.7" font-size="31" fill="#55524e">The habits, history and language an</text>
<text x="64" y="998.7" font-size="31" fill="#55524e">organisation grows from. The slowest</text>
<text x="64" y="1039.7" font-size="31" fill="#55524e">ground of all</text>
<line x1="624.0" y1="1125.7" x2="763.2" y2="1125.7" stroke="#d63c23" stroke-width="0.9799999999999999" stroke-dasharray="1.2 3.2" stroke-linecap="round"/><circle cx="769.2" cy="1125.7" r="5.88" fill="#ffffff" stroke="#d63c23" stroke-width="1.4"/>
<text x="64" y="1137.7" font-size="36" font-weight="600" letter-spacing="1.2" fill="#a92c17">THE PLACE OF WORK</text>
<text x="64" y="1182.7" font-size="31" fill="#55524e">Where each of these comes together</text>
<text x="64" y="1223.7" font-size="31" fill="#55524e">and becomes lived experience for the</text>
<text x="64" y="1264.7" font-size="31" fill="#55524e">people doing the work</text>
<text x="64" y="1353" font-size="22" fill="#55524e">Adapted from the author&#x27;s thesis, after Pagh &amp; Cook (2023).</text>
</svg>